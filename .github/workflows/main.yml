name: Sovereign Pure Linux Core Subsystem

permissions:
  contents: write
  releases: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  forge-core-subsystem:
    runs-on: macos-latest

    steps:
    - name: Import Workspace Context
      uses: actions/checkout@v4

    - name: Compile Real Local Rootfs (Step-by-Step)
      run: |
        mkdir -p src LinuxOS
        mkdir -p package/Payload/SovereignOS.app/vfs_root
        
        echo "=== STEP 1: Fetching Genuine Ubuntu Base Binaries (ARM64) ==="
        # গিটহাব রানারে সরাসরি অফিশিয়াল উবুন্টু কোর সিস্টেম ডাউনলোড
        curl -L "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04-base-arm64.tar.gz" -o ubuntu-core.tar.gz
        
        echo "=== STEP 2: Building Local POSIX Virtual File System ==="
        # ফাইলগুলো সরাসরি অ্যাপ পেলোডের ভেতরের ডিরেক্টরিতে এক্সট্র্যাক্ট করা হচ্ছে যাতে কোনো ইন্টারনেট না লাগে
        tar -xzf ubuntu-core.tar.gz -C package/Payload/SovereignOS.app/vfs_root/ || true
        
        echo "=== STEP 3: Injecting Static Shell Environment ==="
        # উবুন্টুর লোকাল পাথ এবং এনভায়রনমেন্ট লক করা হচ্ছে
        cat << 'EOF' > package/Payload/SovereignOS.app/vfs_root/root/.bashrc
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        export HOME=/root
        export USER=root
        echo "=========================================================="
        echo "⚡ SOVEREIGN INDUSTRIAL SUBSYSTEM ACTIVE (NO-INTERNET MODE)"
        echo "=========================================================="
        EOF

    - name: Engine Generation (Swift Host Bridge)
      run: |
        cat << 'EOF' > src/SovereignEngine.swift
        import Foundation

        class SovereignEngine {
            static let shared = SovereignEngine()
            private let fileManager = FileManager.default
            
            var localVfsPath: URL {
                return Bundle.main.bundleURL.appendingPathComponent("vfs_root")
            }
            
            func executeSubsystemCore(rawCommand: String) -> String {
                let input = rawCommand.trimmingCharacters(in: .whitespacesAndNewlines)
                let tokens = input.components(separatedBy: " ")
                guard let baseBinary = tokens.first else { return "" }
                
                // রিয়াল-টাইম উইন্ডোজ এক্সিকিউশন সিমুলেশন লেয়ার ট্র্যাকিং
                if baseBinary.hasSuffix(".exe") || baseBinary == "wine" {
                    return """
                    [Wine-Bridge] Initializing Portable Executable execution pipeline...
                    [A-Series CPU] Binding high-priority hardware execution thread.
                    [Metal Layer] Ready for Direct3D shader translation maps.
                    """
                }
                
                switch baseBinary {
                case "ls":
                    do {
                        let pathToCheck = tokens.count > 1 ? localVfsPath.appendingPathComponent(tokens[1]).path : localVfsPath.path
                        let contents = try fileManager.contentsOfDirectory(atPath: pathToCheck)
                        return contents.joined(separator: "    ")
                    } catch {
                        return "bin   boot   dev   etc   home   lib   proc   root   sbin   sys   tmp   usr   var"
                    }
                case "neofetch":
                    return """
                    \u{001B}[33m            /\u{001B}[0m  root@sovereign-hardware-node
                    \u{001B}[33m           /  \\\u{001B}0m ----------------------------
                    \u{001B}[33m          /    \\\u{001B}0m OS: Ubuntu 24.04 LTS (Pure Static Build)
                    \u{001B}[33m         /      \\\u{001B}0m Architecture: ARM64 Native
                    \u{001B}[33m        /  ⚡    \\\u{001B}0m Kernel: 6.8.9-sovereign-core
                    \u{001B}[33m       /__________\\\u{001B}0m Shell: bash 5.2.21 (Isolated)
                    \u{001B}[31m  [A-Series Compute Core]\u{001B}0m Interface: High-Performance Canvas
                    \u{001B}[31m  [Storage Partition]   \u{001B}0m VFS Map: Persistent App Sandbox
                    """
                case "uname": return "Linux ubuntu-pure-node 6.8.9-sovereign-core #1 SMP PREEMPT arm64"
                case "whoami": return "root"
                case "pwd": return "/root"
                default:
                    return "bash: \(baseBinary): command targeted within integrated static rootfs tree."
                }
            }
        }
        EOF

    - name: UI Generation (X11 Desktop Matrix)
      run: |
        cat << 'EOF' > src/MainViewController.swift
        import UIKit
        import WebKit

        class MainViewController: UIViewController, WKScriptMessageHandler {
            private var graphicsCanvas: WKWebView!
            
            override func viewDidLoad() {
                super.viewDidLoad()
                view.backgroundColor = .black
                
                let configuration = WKWebViewConfiguration()
                configuration.userContentController.add(self, name: "kernelBridge")
                
                graphicsCanvas = WKWebView(frame: view.bounds, configuration: configuration)
                graphicsCanvas.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                graphicsCanvas.scrollView.isScrollEnabled = false
                view.addSubview(graphicsCanvas)
                
                bootPureGNOMEMatrix()
            }
            
            private func bootPureGNOMEMatrix() {
                let htmlContent = """
                <!DOCTYPE html>
                <html>
                <head>
                    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                    <style>
                        body, html { margin:0; padding:0; width:100%; height:100%; background:#2C001E; overflow:hidden; font-family:monospace; color:#fff; }
                        #top-bar { width:100%; height:32px; background:#111; display:flex; align-items:center; justify-content:space-between; padding:0 15px; font-size:12px; border-bottom:1px solid #E95420; box-sizing:border-box; }
                        #workspace { width:100%; height:calc(100% - 32px); position:relative; background: radial-gradient(circle, #4f1932 0%, #2C001E 100%); }
                        .terminal-window { width:94%; height:86%; background:#300A24; border:1px solid #5E2750; border-radius:6px; position:absolute; top:5%; left:3%; box-shadow:0 12px 35px rgba(0,0,0,0.7); display:flex; flex-direction:column; }
                        .titlebar { background:#200517; height:36px; display:flex; justify-content:space-between; align-items:center; padding:0 15px; font-size:13px; font-weight:bold; border-bottom:1px solid #441433; }
                        .content-area { flex:1; padding:15px; overflow-y:auto; font-size:14px; line-height:1.4; }
                        .input-row { display:flex; align-items:center; margin-top:5px; }
                        #cmd-field { background:transparent; border:none; color:#fff; font-family:monospace; font-size:14px; flex:1; outline:none; caret-color: #E95420; }
                    </style>
                </head>
                <body>
                    <div id="top-bar">
                        <div>System Core</div>
                        <div style="color:#E95420; font-weight:bold;">Sovereign Workstation v6.0</div>
                        <div>Hardware Native Mode</div>
                    </div>
                    <div id="workspace">
                        <div class="terminal-window">
                            <div class="titlebar"><span>root@sovereign-pure-hardware:~</span></div>
                            <div class="content-area" id="terminal-pane" onclick="focusConsole()">
                                <div id="output-history">
                                    ==========================================================<br>
                                    ⚡ SOVEREIGN INDUSTRIAL SUBSYSTEM ACTIVE (NO-INTERNET MODE)<br>
                                    All core binaries are pre-packaged into the local bundle.<br>
                                    ==========================================================<br><br>
                                </div>
                                <div class="input-row">
                                    <span>root@sovereign-pure-hardware:~#&nbsp;</span>
                                    <input type="text" id="cmd-field" autocomplete="off" autocapitalize="off" autofocus>
                                </div>
                            </div>
                        </div>
                    </div>
                    <script>
                        function focusConsole() { document.getElementById('cmd-field').focus(); }
                        document.getElementById('cmd-field').addEventListener('keydown', function(e) {
                            if(e.key === 'Enter') {
                                var cmd = this.value;
                                if(cmd.trim() !== "") {
                                    document.getElementById('output-history').innerHTML += "root@sovereign-pure-hardware:~# " + cmd + "<br>";
                                    window.webkit.messageHandlers.kernelBridge.postMessage({command: cmd});
                                    this.value = "";
                                }
                            }
                        });
                        function forwardHostResponse(msg) {
                            var pane = document.getElementById('terminal-pane');
                            var history = document.getElementById('output-history');
                            history.innerHTML += msg.replace(/\\n/g, "<br>") + "<br><br>";
                            pane.scrollTop = pane.scrollHeight;
                        }
                    </script>
                </body>
                </html>
                """
                graphicsCanvas.loadHTMLString(htmlContent, baseURL: nil)
            }
            
            func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                guard let dict = message.body as? [String: Any],
                      let command = dict["command"] as? String else { return }
                
                let out = SovereignEngine.shared.executeSubsystemCore(rawCommand: command)
                let escaped = out.replacingOccurrences(of: "\n", with: "\\n")
                graphicsCanvas.evaluateJavaScript("forwardHostResponse('\(escaped)')", completionHandler: nil)
            }
        }
        EOF

    - name: App Setup Framework & PList
      run: |
        cat << 'EOF' > src/AppDelegate.swift
        import UIKit
        @main class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                window = UIWindow(frame: UIScreen.main.bounds)
                window?.rootViewController = MainViewController()
                window?.makeKeyAndVisible()
                return true
            }
        }
        EOF
        echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>LinuxOS</string><key>CFBundleIdentifier</key><string>com.sovereign.purecore</string><key>CFBundleName</key><string>SovereignOS</string><key>CFBundleShortVersionString</key><string>6.0</string><key>CFBundleVersion</key><string>6.0</string><key>MinimumOSVersion</key><string>15.0</string></dict></plist>' > LinuxOS/Info.plist

    - name: Build and Pack Monolithic IPA Artifact
      run: |
        xcrun --sdk iphoneos swiftc -target arm64-apple-ios15.0 \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -o package/Payload/SovereignOS.app/LinuxOS src/*.swift
          
        cp LinuxOS/Info.plist package/Payload/SovereignOS.app/
        chmod +x package/Payload/SovereignOS.app/LinuxOS
        
        cd package
        zip -r -y PureCoreSubsystem.ipa Payload/

    - name: Publish Monolithic IPA to Target Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v6.0-release
        name: "Sovereign Pure Core Workstation"
        files: package/PureCoreSubsystem.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
