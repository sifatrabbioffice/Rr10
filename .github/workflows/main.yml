                                📁 bin/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 boot/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 dev/<br>
                                📁 etc/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 home/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 root/<br>
                                📁 usr/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 var/ &nbsp;&nbsp;&nbsp;&nbsp; 📁 tmp/
                            </div>
                        </div>
                    </div>
                    
                    <script>
                        function toggleXWindow(id) {
                            var boxes = document.getElementsByClassName('x11-container');
                            for(var i=0; i<boxes.length; i++) { boxes[i].style.display = "none"; }
                            document.getElementById(id).style.display = "flex";
                        }
                        function closeXWindow(id) {
                            document.getElementById(id).style.display = "none";
                        }
                        function triggerSovereignApt(pkg) {
                            document.getElementById('target-'+pkg).innerText = "Compiling...";
                            document.getElementById('target-'+pkg).style.background = "#444";
