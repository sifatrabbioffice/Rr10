                        .install-btn { background:#E95420; color:white; border:none; padding:5px 12px; border-radius:4px; font-size:11px; font-weight:bold; }
                    </style>
                </head>
                <body>
                    <div id="gnome-desktop">
                        <div id="top-bar">
                            <div class="bar-section"><span class="clickable" onclick="toggleWindow('software-center')">Activities</span></div>
                            <div class="bar-section" style="font-weight:500;">Ubuntu Node Runtime</div>
                            <div class="bar-section"><span>⌁ 100%</span></div>
                        </div>
                        
                        <div id="ubuntu-dock">
                            <div class="dock-icon icon-terminal" onclick="toggleWindow('terminal-window')">🐚</div>
                            <div class="dock-icon icon-software" onclick="toggleWindow('software-center')">🛍️</div>
                            <div class="dock-icon icon-files" onclick="toggleWindow('file-window')">📂</div>
                        </div>
                        
                        <!-- APP WINDOW 1: APT SOFTWARE CENTER -->
                        <div id="software-center" class="x11-window">
                            <div class="window-header">
