                userContentController.add(self, name: "sovereignCoreBridge")
                
                let webConfiguration = WKWebViewConfiguration()
                webConfiguration.userContentController = userContentController
                webConfiguration.preferences.javaScriptEnabled = true
                
                dynamicX11Canvas = WKWebView(frame: .zero, configuration: webConfiguration)
                dynamicX11Canvas.backgroundColor = .black
                dynamicX11Canvas.scrollView.isScrollEnabled = false
                dynamicX11Canvas.translatesAutoresizingMaskIntoConstraints = false
                
                view.addSubview(dynamicX11Canvas)
                
                NSLayoutConstraint.activate([
                    dynamicX11Canvas.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                    dynamicX11Canvas.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                    dynamicX11Canvas.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                    dynamicX11Canvas.bottomAnchor.constraint(equalTo: view.bottomAnchor)
                ])
                
                streamGNOMECanvas()
            }
            
